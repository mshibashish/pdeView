[project]
name = "pdeview"
version = "0.1.0"
description = "Interactive viewer for 2D shallow-water equation solutions: PDEBench ground truth vs. a verified pretrained Fourier Neural Operator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "h5py>=3.10",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    "requests>=2.31",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pdeview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
